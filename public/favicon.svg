<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favicon-plate-grad" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#8B6BFF" />
      <stop offset="52%" stop-color="#6E44FF" />
      <stop offset="100%" stop-color="#3D21A6" />
    </linearGradient>
    <filter id="arrow-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#1F1147" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Chamfered Modular Baseplate in Spherule Violet -->
  <path
    d="M14 0 H86 L100 14 V86 L86 100 H14 L0 86 V14 Z"
    fill="url(#favicon-plate-grad)"
  />

  <!-- 45° Dispatch Arrow (↗) -->
  <g filter="url(#arrow-shadow)">
    <path
      d="M28 29.5 H70.5 V72"
      stroke="#FFFFFF"
      stroke-width="11"
      stroke-linecap="butt"
      stroke-linejoin="miter"
    />
    <path
      d="M70.5 29.5 L27 73"
      stroke="#FFFFFF"
      stroke-width="11"
      stroke-linecap="butt"
    />
  </g>
</svg>
